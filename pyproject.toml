[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "sttm-ai-platform"
version = "0.1.0"
description = "AI-Assisted Source-to-Target Mapping platform."
readme = "README.md"
requires-python = ">=3.11,<3.14"

authors = [
    { name = "STTM Platform Engineering Team" }
]

dependencies = [
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "langgraph>=0.3,<1.0",
    "langchain-core>=0.3,<1.0",
    "google-cloud-aiplatform>=1.71,<2.0",
    "google-genai>=1.0,<2.0",
    "networkx>=3.4,<4.0",
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "streamlit>=1.40,<2.0",
    "python-dotenv>=1.0,<2.0",
    "tenacity>=9.0,<10.0",
    "structlog>=24.4,<26.0",
]


[project.optional-dependencies]

dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
]


[project.scripts]
sttm = "sttm.cli:main"


[tool.setuptools]
package-dir = {"" = "."}


[tool.setuptools.packages.find]
include = ["sttm*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]


[tool.ruff]
target-version = "py311"
line-length = 100

exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "S",
]

ignore = [
    "S101",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true


[tool.coverage.run]
branch = true
source = ["sttm"]


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
